[project]
name = "mcp-postgres"
version = "0.1.0"
description = "PostgreSQL operations as Python library, LangChain tools, and MCP server"
authors = [{name = "Landry Zetam"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["psycopg2-binary>=2.9.0", "pydantic-settings>=2.0"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0.0", "asyncpg>=0.29.0"]
langchain = ["langchain-core>=0.2.0", "pydantic>=2.0.0"]
all = ["mcp[cli]>=1.0.0", "asyncpg>=0.29.0", "langchain-core>=0.2.0", "pydantic>=2.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/lyzetam/mcp-postgres"
Repository = "https://github.com/lyzetam/mcp-postgres"

[project.scripts]
mcp-postgres = "mcp_postgres.server:main"
mcp-postgres-readonly = "mcp_postgres.server_readonly:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_postgres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
